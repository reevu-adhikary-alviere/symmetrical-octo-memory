  /v3/ach/debit:
    post:
      summary: ACH Debit
      description: |
        Creates a new payment transaction from a payment method to a wallet.

        **Payment Flow:**
        - Source: Payment method (e.g., bank account with mandate on file)
        - Destination: Business wallet to receive funds
        - The payment is created with status `CREATED` and processed asynchronously. If `execute_at`
          is a future timestamp, it is instead created in status `WAITING` and held — moving no
          funds — until that date, then released through the ordinary payment lifecycle.
      parameters:
        - $ref: '#/components/parameters/Authorization'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/payment-create-request'
            examples:
              immediate-payment:
                summary: Immediate payment
                value:
                  external_id: inv_1000456
                  amount: "25.99"
                  currency: USD
                  source:
                    payment_method_uuid: 123e4567-e89b-12d3-a456-426614174000
                  destination:
                    wallet_uuid: 223e4567-e89b-12d3-a456-426614174000
                  accepted_legal_texts:
                    - ee332079-3bf4-4f9d-8f2b-df980c459ee9
                  description: Invoice #1000456
                  metadata:
                    invoice_id: "1000456"
              future-dated-payment:
                summary: Future-dated payment held until execute_at
                value:
                  external_id: inv_1000457
                  amount: "25.99"
                  currency: USD
                  source:
                    payment_method_uuid: 123e4567-e89b-12d3-a456-426614174000
                  destination:
                    wallet_uuid: 223e4567-e89b-12d3-a456-426614174000
                  accepted_legal_texts:
                    - ee332079-3bf4-4f9d-8f2b-df980c459ee9
                  execute_at: "2025-02-01T09:00:00Z"
                  description: Invoice #1000457 (scheduled)
                  metadata:
                    invoice_id: "1000457"
      responses:
        '201':
          description: |
            The request was successful and the payment was created.
          headers:
            Alv-Request-Id:
              description: |
                Alviere's internal unique identifier for the request. This ID is automatically generated by our API service and
                spans across our entire infrastructure allowing tech ops to trace a request. This id has no business use case
                and serves solely for the purpose of technical debugging and troubleshooting.
              example: 8944355f-342d-42df-9ec9-5b12e619d504
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/payment-create-response'
              examples:
                immediate-payment:
                  summary: Immediate payment response
                  value:
                    transaction:
                      transaction_uuid: 3fa85f64-5717-4562-b3fc-2c963f66afa5
                      external_id: inv_1000456
                      type: PAYMENT
                      status: CREATED
                      description: Invoice #1000456
                      amount: "25.99"
                      currency: USD
                      wallet_uuid: "223e4567-e89b-12d3-a456-426614174000"
                      account_uuid: "323e4567-e89b-12d3-a456-426614174000"
                      returned: false
                      funds_source:
                        payment_method_uuid: "123e4567-e89b-12d3-a456-426614174001"
                      created_at: "2020-12-30T15:04:05.999999999Z"
                      updated_at: "2020-12-30T15:04:05.999999999Z"
                      metadata:
                        invoice_id: "1000456"
                payment-with-fees:
                  summary: Payment response with service fees
                  value:
                    transaction:
                      transaction_uuid: 3fa85f64-5717-4562-b3fc-2c963f66afa5
                      external_id: inv_1000456
                      type: PAYMENT
                      status: CREATED
                      description: Invoice #1000456
                      amount: "25.99"
                      currency: USD
                      wallet_uuid: "223e4567-e89b-12d3-a456-426614174000"
                      account_uuid: "323e4567-e89b-12d3-a456-426614174000"
                      returned: false
                      funds_source:
                        payment_method_uuid: "123e4567-e89b-12d3-a456-426614174001"
                      child_transactions:
                        - transaction_uuid: "789e0123-e89b-12d3-a456-426614174002"
                          type: SERVICE_FEE
                          status: COMPLETED
                          amount: "-3.00"
                          currency: USD
                      created_at: "2020-12-30T15:04:05.999999999Z"
                      updated_at: "2020-12-30T15:04:05.999999999Z"
                      metadata:
                        invoice_id: "1000456"
        '400':
          $ref: '#/components/responses/400-Error'
        '401':
          $ref: '#/components/responses/401-Error'
        '403':
          $ref: '#/components/responses/403-Error'
        '404':
          $ref: '#/components/responses/404-Error'
        '409':
          description: Conflict on the field `external_id` - returns the existing transaction
          headers:
            Alv-Request-Id:
              description: |
                Alviere's internal unique identifier for the request. This ID is automatically generated by our API service and
                spans across our entire infrastructure allowing tech ops to trace a request. This id has no business use case
                and serves solely for the purpose of technical debugging and troubleshooting.
              example: 8944355f-342d-42df-9ec9-5b12e619d504
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/payment-create-response'
              examples:
                duplicate-payment:
                  summary: Duplicate payment - returns existing transaction
                  value:
                    transaction:
                      transaction_uuid: 3fa85f64-5717-4562-b3fc-2c963f66afa5
                      external_id: inv_1000456
                      type: PAYMENT
                      status: CREATED
                      description: Invoice #1000456
