  /v3/cards/capture:
    post:
      summary: Capture card transaction
      description: |
        Capture a previously authorized (AUTH-only) card transaction.

        Only valid when the parent transaction's `type_details.card_payment_details.auth_type` is `AUTH` and `captured_at` is not yet set.
        Omit `amount` to capture the full authorized amount; pass `amount` to capture a smaller amount (partial capture) — the unused authorization is released back to the cardholder.

        On success, the transaction's `type_details.card_payment_details.captured_at` is populated.
        The transaction's `status` remains `COMPLETED` — no new transaction is created.
      parameters:
        - $ref: '#/components/parameters/Authorization'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/card-capture-request'
            examples:
              capture-full:
                summary: Capture the full authorized amount
                value:
                  transaction_uuid: 3fa85f64-5717-4562-b3fc-2c963f66afa5
              capture-partial:
                summary: Partial capture (less than the authorized amount)
                value:
                  transaction_uuid: 3fa85f64-5717-4562-b3fc-2c963f66afa5
                  amount: "100.00"
              capture-with-metadata:
                summary: Capture with an annotation
                value:
                  transaction_uuid: 3fa85f64-5717-4562-b3fc-2c963f66afa5
                  description: Captured on fulfillment
                  metadata:
                    fulfillment_id: ful_88102
      responses:
        '201':
          description: The transaction was captured successfully.
          headers:
            Alv-Request-Id:
              description: Alviere's internal unique identifier for the request.
              example: 8944355f-342d-42df-9ec9-5b12e619d504
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/card-transaction-response'
              examples:
                captured:
                  summary: AUTH-only transaction now captured
                  value:
                    transaction:
                      transaction_uuid: 3fa85f64-5717-4562-b3fc-2c963f66afa5
                      external_id: order_1000458
                      type: PAYMENT
                      status: COMPLETED
                      amount: "150.00"
