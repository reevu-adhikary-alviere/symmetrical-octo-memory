  /v3/schedule/{schedule_uuid}:
    parameters:
      - $ref: '#/components/parameters/schedule_uuid'
      - $ref: '#/components/parameters/Authorization'
    get:
      tags:
        - Scheduled Payments
      summary: Get schedule
      description: |
        Gets a payment or withdraw schedule by `schedule_uuid`.

        Use `/v3/schedule/{schedule_uuid}/executions` for occurrence history.
      operationId: schedules-get
      responses:
        '200':
          description: OK
          headers:
            Alv-Request-Id:
              description: Alviere's internal unique identifier for the request.
              example: 8944355f-342d-42df-9ec9-5b12e619d504
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/schedule-response'
        '400':
          $ref: '#/components/responses/400-Error'
        '401':
          $ref: '#/components/responses/401-Error'
        '403':
          $ref: '#/components/responses/403-Error'
        '404':
          $ref: '#/components/responses/404-Error'
    patch:
      tags:
        - Scheduled Payments
      summary: Update schedule
      description: |
        Updates a schedule. Only `ACTIVE` or `PAUSED` schedules can be modified.

        **Updatable fields:**
        - `amount`: Modify the stored amount. `RULE` is valid for withdraw schedules only; sending it for a payment schedule returns 400.
        - `description`: Update description
        - `metadata`: Update metadata
        - `status`: Pause (`PAUSED`) or resume (`ACTIVE`)
        - `schedule_details.execute_at`: Update the cadence anchor datetime
        - `schedule_details.frequency`, `schedule_details.day_of_week`, etc.: Update cadence

        Type, source, destination, currency, and external_id are immutable.
      operationId: schedules-update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/schedule-update-request'
            examples:
              update-anchor:
                summary: Update the cadence anchor datetime
                value:
                  schedule_details:
                    execute_at: "2025-01-20T14:00:00Z"
              pause:
                summary: Pause a schedule
                value:
                  status: PAUSED
              resume:
                summary: Resume a schedule
                value:
                  status: ACTIVE
              update-amount:
                summary: Update amount and description
                value:
                  amount:
                    type: FIXED
                    value: "750.00"
                  description: Updated weekly withdrawal
      responses:
        '200':
          description: Schedule updated
          headers:
            Alv-Request-Id:
              description: Alviere's internal unique identifier for the request.
              example: 8944355f-342d-42df-9ec9-5b12e619d504
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/schedule-response'
        '400':
          $ref: '#/components/responses/400-Error'
        '401':
          $ref: '#/components/responses/401-Error'
        '403':
          $ref: '#/components/responses/403-Error'
        '404':
          $ref: '#/components/responses/404-Error'
        '409':
          description: Cannot modify - schedule not in ACTIVE or PAUSED status (returns existing schedule)
          headers:
            Alv-Request-Id:
              description: Alviere's internal unique identifier for the request.
              example: 8944355f-342d-42df-9ec9-5b12e619d504
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/schedule-response'
    delete:
      tags:
        - Scheduled Payments
      summary: Cancel schedule
      description: |
        Cancels a schedule. Only `ACTIVE` or `PAUSED` schedules can be canceled.

        Canceled schedules cannot be reactivated. Prior executions and any transactions they
        created remain readable.
      operationId: schedules-cancel
      responses:
        '204':
          description: Schedule canceled
          headers:
            Alv-Request-Id:
              description: Alviere's internal unique identifier for the request.
              example: 8944355f-342d-42df-9ec9-5b12e619d504
              schema:
                type: string
        '400':
          $ref: '#/components/responses/400-Error'
        '401':
          $ref: '#/components/responses/401-Error'
        '403':
          $ref: '#/components/responses/403-Error'
        '404':
          $ref: '#/components/responses/404-Error'
        '409':
          description: Cannot cancel - schedule is in a terminal state (returns existing schedule)
          headers:
            Alv-Request-Id:
              description: Alviere's internal unique identifier for the request.
              example: 8944355f-342d-42df-9ec9-5b12e619d504
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/schedule-response'

  /v3/schedule/{schedule_uuid}/executions:
    parameters:
      - $ref: '#/components/parameters/schedule_uuid'
      - $ref: '#/components/parameters/Authorization'
    get:
      tags:
        - Scheduled Payments
      summary: List schedule executions
      description: |
        Gets the execution history for a schedule.

        An execution is an occurrence attempt. It does not always create a transaction
        (`SUCCESS` with a transaction, or `SKIPPED` / `FAILED` without one).

        Executions are sorted by execution number descending (latest first).
      operationId: schedules-executions-list
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: OK
          headers:
            Alv-Request-Id:
              description: Alviere's internal unique identifier for the request.
              example: 8944355f-342d-42df-9ec9-5b12e619d504
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/schedule-executions-list-response'
        '400':
          $ref: '#/components/responses/400-Error'
        '401':
          $ref: '#/components/responses/401-Error'
        '403':
