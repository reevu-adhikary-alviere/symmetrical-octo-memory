          schema:
            $ref: '#/components/schemas/schedule-type'
          description: Filter by schedule type
        - name: wallet_uuid
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by wallet UUID (source or destination)
        - name: executed_after
          in: query
          schema:
            type: string
            format: date-time
          description: Filter schedules with next execution after this datetime
        - name: executed_before
          in: query
