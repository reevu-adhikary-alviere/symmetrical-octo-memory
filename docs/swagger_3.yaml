    payment-create-request:
      title: Payment creation request
      type: object
      description: Request payload for creating a new payment transaction
      required:
        - external_id
        - amount
        - currency
        - source
        - destination
      properties:
        external_id:
          type: string
          description: |
            The unique identifier of this payment in your own system.
            This is used for idempotency - duplicate requests with the same external_id will be rejected with a 409 error.
          example: inv_1000456
        amount:
          type: string
          description: The payment amount as a decimal string
          example: "25.99"
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: The currency code in ISO-4217 format
          example: USD
        source:
          type: object
          description: The source of funds for the payment
          required:
            - payment_method_uuid
          properties:
            payment_method_uuid:
              type: string
              format: uuid
              description: The UUID of the payment method (e.g., bank account with mandate on file)
              example: 123e4567-e89b-12d3-a456-426614174000
        destination:
          type: object
          description: The destination for the payment funds
          required:
            - wallet_uuid
          properties:
            wallet_uuid:
              type: string
              format: uuid
              description: The UUID of the wallet to receive the funds
              example: 223e4567-e89b-12d3-a456-426614174000
        description:
          type: string
          description: Optional description for the payment
          maxLength: 255
          example: Invoice #1000456
        accepted_legal_texts:
          type: array
          description: |
            Array of legal text UUIDs that the user has accepted.
            Required for ACH debit transactions. Retrieve available legal texts from the legal texts endpoint.
          items:
            type: string
            format: uuid
          example:
            - ee332079-3bf4-4f9d-8f2b-df980c459ee9
        execute_at:
          type: string
          format: date-time
          description: |
            Optional future timestamp (RFC 3339) at which to execute the payment. When omitted, the
            payment executes immediately. When set to a future time, the transaction is created in
            status `WAITING` and held — moving no funds — until its execution date, then released
            through the ordinary payment lifecycle. A held payment can be canceled while `WAITING`.
            Must be in the future; not supported on card rails.
          example: "2025-02-01T09:00:00Z"
        metadata:
          type: object
          description: Allows for any number of custom metadata keys and values to be stored with a given entity
          example:
            invoice_id: "1000456"
            customer_id: "cust_789"

    payment-create-response:
      title: Payment creation response
      type: object
      description: Response containing the created payment transaction details
      required:
        - transaction
      properties:
        transaction:
          type: object
          required:
            - transaction_uuid
            - external_id
            - type
            - status
            - amount
            - currency
            - created_at
            - updated_at
          properties:
            transaction_uuid:
              type: string
              format: uuid
              description: Alviere's unique identifier for this transaction
              example: 3fa85f64-5717-4562-b3fc-2c963f66afa5
            external_id:
              type: string
              description: Your unique identifier for this payment
              example: inv_1000456
            type:
              type: string
              enum:
                - PAYMENT
              description: The type of transaction
              example: PAYMENT
            status:
              $ref: '#/components/schemas/transaction-status'
            description:
              type: string
              description: The description of the payment
              example: Invoice #1000456
            amount:
              type: string
              description: The payment amount as a decimal string
              example: "25.99"
            currency:
              type: string
              description: The currency code in ISO-4217 format
              example: USD
            wallet_uuid:
              type: string
              format: uuid
              description: UUID of the wallet
              example: "223e4567-e89b-12d3-a456-426614174000"
            account_uuid:
              type: string
              format: uuid
              description: UUID of the account
              example: "323e4567-e89b-12d3-a456-426614174000"
            returned:
              type: boolean
              description: Indicates whether this payment transaction has been returned
              example: false
            funds_source:
              type: object
              description: The source of funds for this transaction (payment method for PAYMENT transactions)
              properties:
                payment_method_uuid:
                  type: string
                  format: uuid
                  description: UUID of the payment method
                  example: "123e4567-e89b-12d3-a456-426614174000"
            created_at:
              type: string
              format: date-time
              description: The timestamp when the payment was created
              example: "2020-12-30T15:04:05.999999999Z"
            updated_at:
              type: string
              format: date-time
              description: The timestamp when the payment was last updated
              example: "2020-12-30T15:04:05.999999999Z"
            execute_at:
              type: string
              format: date-time
              description: |
                Present when the payment was created with a future execution date. While the payment
                is held its status is `WAITING`; it is released for processing on this date.
              example: "2025-02-01T09:00:00Z"
            child_transactions:
              type: array
              description: Child transactions associated with this payment, such as service fees. Only present when applicable.
              items:
                type: object
                required:
                  - transaction_uuid
                  - type
                  - status
                  - amount
                  - currency
                properties:
                  transaction_uuid:
                    type: string
                    format: uuid
                    description: Alviere's unique identifier for the child transaction
                    example: "789e0123-e89b-12d3-a456-426614174002"
                  type:
                    type: string
                    description: The type of child transaction
                    example: SERVICE_FEE
                  status:
                    $ref: '#/components/schemas/transaction-status'
                  amount:
                    type: string
                    description: The transaction amount as a decimal string
                    example: "-3.00"
                  currency:
                    type: string
                    description: The currency code in ISO-4217 format
                    example: USD
            metadata:
              type: object
              description: Allows for any number of custom metadata keys and values to be stored with a given entity

    fee-rule-fee-scope:
      type: string
      title: Fee scope
      description: Defines the OWNER of the fee rule and who receives fee revenue. PROGRAM-owned rules apply to all accounts under the program without requiring explicit account associations. ACCOUNT-owned rules require explicit account associations to apply. Unassigned ACCOUNT-owned rules do not apply to any transactions.
      enum: [ACCOUNT, PROGRAM]

    fee-rule-status:
      type: string
      title: Fee rule status
      enum: [ACTIVE, INACTIVE, DELETED]

    fee-rule-update-status:
      type: string
      title: Fee rule update status
      description: Status values allowed for updating a fee rule. Use the DELETE endpoint to set status to DELETED.
      enum: [ACTIVE, INACTIVE]

    fee-rule-fee-type:
      type: string
      title: Fee type
      description: Transaction type created when this fee rule is applied.
      enum: [SERVICE_FEE, CONVENIENCE_FEE]

    fee-rule-parent-transaction-type:
      type: string
      title: Fee rule parent transaction type
      description: The parent transaction type the fee rule applies to.
      enum: [PAYMENT]

    fee-rule-calc-type:
      type: string
      title: Fee rule calculation type
      description: |
        For PAYMENT:
        - `CONVENIENCE_FEE` must be `UPCHARGE` (increases the external debit amount).
        - `SERVICE_FEE` must be `DEDUCT` (deducted from the destination account proceeds).
      enum: [UPCHARGE, DEDUCT]

    fee-rule-value:
      title: Fee rule value
      description: Either a fixed amount (as a decimal string in the transaction currency) or a percent (with optional cap as a decimal string).
      oneOf:
        - title: Amount
          type: object
          required: [amount]
          properties:
            amount:
              type: string
              description: |
                Fixed fee amount as a decimal string in the transaction currency.
                e.g. 1 USD will be represented as `amount: "1.00"`.
        - title: Percent
          type: object
          required: [percent]
          properties:
            percent:
              type: number
              format: float
              exclusiveMinimum: 0
              maximum: 100
              description: Percent fee to apply on the parent transaction base amount.
            cap:
              type: ["string", "null"]
              description: |
                Optional cap as a decimal string in the transaction currency.
                If null, there is no cap.

    fee-rule-fee-criteria:
      title: Fee criteria
      type: object
      required: [transaction_types]
      properties:
        transaction_types:
          type: array
          items:
            $ref: '#/components/schemas/fee-rule-parent-transaction-type'
          minItems: 1
        currencies:
          type: array
          description: If provided, the rule applies only to these currencies.
          items:
            type: string
            pattern: ^[A-Z]{3}$
          minItems: 1

    fee-rule-fee-criteria-update:
      title: Fee criteria update
      description: Fee criteria for partial updates. All fields are optional and use partial merge semantics — only provided fields are updated.
      type: object
      properties:
        transaction_types:
          type: array
          items:
            $ref: '#/components/schemas/fee-rule-parent-transaction-type'
          minItems: 1
        currencies:
          type: array
          description: If provided, the rule applies only to these currencies.
          items:
            type: string
            pattern: ^[A-Z]{3}$
          minItems: 1

    fee-rule:
      title: Fee rule
      type: object
      required:
        - fee_rule_uuid
        - program_uuid
        - fee_scope
        - status
        - fee_type
        - calc_type
        - value
        - fee_criteria
        - created_at
        - updated_at
      properties:
        fee_rule_uuid:
          type: string
          format: uuid
        program_uuid:
          type: string
          format: uuid
        fee_scope:
          $ref: '#/components/schemas/fee-rule-fee-scope'
        status:
          $ref: '#/components/schemas/fee-rule-status'
        external_id:
          type: string
          description: |
            Idempotency key in the caller's system. Must be unique per owner.

            **Strongly recommended.** While optional, omitting this field means duplicate requests cannot be detected. Always provide a stable, unique identifier from your system to ensure safe retries.
        description:
          type: string
          minLength: 1
          maxLength: 255
        fee_type:
          $ref: '#/components/schemas/fee-rule-fee-type'
        calc_type:
          $ref: '#/components/schemas/fee-rule-calc-type'
        value:
          $ref: '#/components/schemas/fee-rule-value'
        fee_criteria:
          $ref: '#/components/schemas/fee-rule-fee-criteria'
        display:
          type: boolean
          description: Whether this fee is shown in the payment UI.
        metadata:
          type: object
          description: Allows for any number of custom metadata keys and values to be stored with a given entity
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    fee-rule-create:
      title: Fee rule create
      type: object
      required:
        - fee_scope
        - fee_type
        - calc_type
        - value
        - fee_criteria
      properties:
        external_id:
          type: string
          description: |
            Idempotency key in the caller's system. Must be unique per owner.

            **Strongly recommended.** While optional, omitting this field means duplicate requests cannot be detected. Always provide a stable, unique identifier from your system to ensure safe retries.
        description:
          type: string
          minLength: 1
          maxLength: 255
        fee_scope:
          $ref: '#/components/schemas/fee-rule-fee-scope'
        fee_type:
          $ref: '#/components/schemas/fee-rule-fee-type'
        calc_type:
          $ref: '#/components/schemas/fee-rule-calc-type'
        value:
          $ref: '#/components/schemas/fee-rule-value'
        fee_criteria:
          $ref: '#/components/schemas/fee-rule-fee-criteria'
        account_uuids:
          type: array
          description: Optional array of account UUIDs to associate with this fee rule during creation. Only applicable when fee_scope is ACCOUNT. Will cause an error if fee_scope is PROGRAM. Use `PUT /v3/fee-rules/account-associations` to manage associations after creation.
          items:
            type: string
            format: uuid
          minItems: 1
        display:
          type: boolean
          default: false
          description: |
            Whether this fee is shown in the payment UI.
            - `true`: Fee is included in the preview response (e.g., convenience fees, processing fees).
            - `false`: Fee is not shown to users (e.g., platform service fees).
        metadata:
          type: object
          description: Allows for any number of custom metadata keys and values to be stored with a given entity

    fee-rule-update:
      title: Fee rule update
      type: object
      properties:
        external_id:
          type: string
          description: |
            Idempotency key in the caller's system. Must be unique per owner.

            **Strongly recommended.** While optional, omitting this field means duplicate requests cannot be detected. Always provide a stable, unique identifier from your system to ensure safe retries.
        status:
          $ref: '#/components/schemas/fee-rule-update-status'
        description:
          type: string
          minLength: 1
          maxLength: 255
        calc_type:
          $ref: '#/components/schemas/fee-rule-calc-type'
        value:
          $ref: '#/components/schemas/fee-rule-value'
        fee_criteria:
          $ref: '#/components/schemas/fee-rule-fee-criteria-update'
        display:
          type: boolean
          description: Whether this fee is shown in the payment UI.
        metadata:
          type: object
          description: Allows for any number of custom metadata keys and values to be stored with a given entity

    fee-rule-response:
      title: Fee rule response
      type: object
      required: [fee_rule]
      properties:
