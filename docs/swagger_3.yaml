  /v3/batches:
    get:
      tags:
        - Batches
      summary: List batches
      description: |
        Lists batch files dropped on SFTP for the program, newest first.

        Filter by `file_name` to look up a specific drop when you have the file name but not the
        `batch_uuid` — the common SFTP reconciliation path.
      operationId: batches-list
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/batch-status'
          description: Filter by status
        - name: instruction_type
          in: query
          schema:
            $ref: '#/components/schemas/batch-instruction-type'
          description: Filter by instruction type
        - name: file_name
          in: query
          schema:
            type: string
          description: Exact drop file name, including extensions
          example: CREATE_PAYMENT_20260706T150500Z.csv.pgp
      responses:
        '200':
          description: OK
          headers:
            Alv-Request-Id:
              description: Alviere's internal unique identifier for the request.
              example: 8944355f-342d-42df-9ec9-5b12e619d504
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/batch-list-response'
              examples:
                mixed:
                  summary: One terminal batch and one still running
                  value:
                    records: 2
                    batches:
                      - batch_uuid: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                        file_name: CREATE_PAYMENT_20260706T150500Z.csv.pgp
                        instruction_type: CREATE_PAYMENT
                        status: PARTIALLY_PROCESSED
                        instruction_count: 4
                        processed_count: 2
                        failed_count: 2
                        result_file_path: /batch-processing/outgoing/results/CREATE_PAYMENT_20260706T150500Z_result.csv.pgp
                        created_at: "2026-07-06T15:05:03Z"
                        updated_at: "2026-07-06T15:05:14Z"
                      - batch_uuid: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                        file_name: CREATE_PAYMENT_20260707T090000Z.csv.pgp
                        instruction_type: CREATE_PAYMENT
                        status: PROCESSING
                        instruction_count: 120
                        processed_count: 31
                        failed_count: 0
                        created_at: "2026-07-07T09:00:04Z"
                        updated_at: "2026-07-07T09:01:22Z"
        '400':
          $ref: '#/components/responses/400-Error'
        '401':
          $ref: '#/components/responses/401-Error'
        '403':
          $ref: '#/components/responses/403-Error'

  /v3/batches/{batch_uuid}:
    parameters:
      - $ref: '#/components/parameters/batch_uuid'
      - $ref: '#/components/parameters/Authorization'
    get:
      tags:
        - Batches
      summary: Get batch
      description: |
        Gets a batch by `batch_uuid`.

        Counts describe instruction materialization, not settlement. A terminal batch means every
        instruction reached `PROCESSED` or `FAILED` — settlement and ACH returns are read on each
        transaction. Per-row outcomes are in the result file on SFTP.
      operationId: batches-get
      responses:
        '200':
          description: OK
          headers:
            Alv-Request-Id:
              description: Alviere's internal unique identifier for the request.
              example: 8944355f-342d-42df-9ec9-5b12e619d504
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/batch'
