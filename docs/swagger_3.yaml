components:
  parameters:
    Authorization:
      name: Authorization
      in: header
      required: true
      schema:
        type: string
        example: Bearer eyJhbGciOiJSUzI1NiIsInR5cCIgOiAiSldUI...
      description: The access token
    beneficiary_uuid:
      name: beneficiary_uuid
      in: path
      required: true
      schema:
        type: string
      description: The unique ID of a Beneficiary
    offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minLength: 0
        default: 0
        minimum: 0
      description: Start after offset amount of items
    transaction_uuid:
      name: transaction_uuid
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The unique ID of a transaction
    schedule_uuid:
      name: schedule_uuid
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The unique ID of a schedule
    batch_uuid:
      name: batch_uuid
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The unique ID of a batch
    fee_rule_uuid:
      name: fee_rule_uuid
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The unique ID of a fee rule
    payment_method_uuid:
      name: payment_method_uuid
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The unique ID of a saved card payment method
    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minLength: 1
        default: 10
        maxLength: 500
        minimum: 1
        maximum: 500
      description: The number of items per page
    wallet_transaction_type:
      name: type
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/transaction-type'
      description: Filter transactions by type
    transaction-status:
      name: status
      in: query
      schema:
        type: string
        enum:
          - CREATED
          - PROCESSING
          - PROCESSING_PAYMENT
          - COMPLETED
          - FAILED
          - ERROR
          - VOIDED
          - PENDING
          - MANUAL_REVIEW
          - REJECTED
          - WAITING
          - CANCELED_USER
          - CANCELED_SYSTEM
      description: String needs to be a valid transaction status, or multiple valid statuses separated by a `,`
    start_date:
      name: start_date
      in: query
      required: false
      schema:
        type: string
        format: date-time
        example: '2019-10-12T07:20:50.52Z'
      description: Start date for list entity - default is first created entity date time
    end_date:
      name: end_date
      in: query
      required: false
      schema:
        type: string
        format: date-time
        example: '2019-10-12T07:20:50.52Z'
      description: End date for list entity

  schemas:
    auth-create-request:
      type: object
      properties:
        client_id:
          type: string
          description: |
            Client ID for authentication.

            **Conditional requirement:** Required when authenticating with client credentials (both program-level and direct account-scoped token generation). Not required when exchanging a program-level token using the Authorization header.
        client_secret:
          type: string
          description: |
            Client secret for authentication.

            **Conditional requirement:** Required when authenticating with client credentials (both program-level and direct account-scoped token generation). Not required when exchanging a program-level token using the Authorization header.
        account_uuid:
          type: string
          format: uuid
          description: |
            UUID of an account that belongs to the program.

            **Usage scenarios:**

            1. **Direct account-scoped token:** Provide this field along with client_id and client_secret to generate an account-scoped token directly (without first obtaining a program-level token)

            2. **Token exchange:** Provide this field with a program-level access token in the Authorization header to exchange it for an account-scoped token

            **Conditional requirement:** Required whenever an account-scoped token is requested. When client credentials are not supplied, an Authorization header containing a program-level token must accompany this field.
        include_public_certificate:
          type: boolean
          default: false
        requested_expires_in:
          type: integer
          minimum: 1
          description: |
            Optional. Requested lifetime of the access token in seconds. When omitted, the platform default lifetime is used.
            Must be greater than zero.

    auth-create-response:
      type: object
      required:
        - access_token
        - expires_in
        - token_type
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
          example: 300
          description: Lifetime of the access token in seconds.
        token_type:
          type: string
          example: bearer
        access_token_expires_in:
          type: integer
          example: 300
          deprecated: true
          description: Deprecated. Use `expires_in` instead.
        access_token_type:
          type: string
          example: bearer
          deprecated: true
          description: Deprecated. Use `token_type` instead.
        public_certificate:
          type: object
          properties:
            id:
              type: string
              description: Identifier of the certificate.
            certificate:
              type: string
              description: PEM-encoded certificate content.

    BeneficiaryWebhookPayload:
      title: Beneficiary webhook payload
      type: object
      description: Webhook payload sent when a beneficiary is created, updated, or deleted
      required:
        - event_uuid
        - event_type
        - event_date
        - event_version
        - program_uuid
        - data
      properties:
        event_uuid:
          type: string
          format: uuid
          description: Unique identifier for this event
          example: 589ed560-1a14-55c1-97e3-63fe40dce312
        event_type:
          type: string
          enum:
            - BENEFICIARY
          description: The type of event
          example: BENEFICIARY
        event_date:
          type: string
          format: date-time
          description: When the event occurred
          example: '2022-10-11T09:11:32.483Z'
        event_version:
          type: string
          description: Version of the event payload
          example: '3.0'
        program_uuid:
          type: string
          format: uuid
          description: The program UUID
